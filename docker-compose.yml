# Runs a database on your own computer for development.
# Start it with:  pnpm db:up   (needs Docker Desktop installed and open)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: aiedu_owner
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: aiedu
    ports:
      - "5432:5432"
    volumes:
      - aiedu_db:/var/lib/postgresql/data

volumes:
  aiedu_db:
